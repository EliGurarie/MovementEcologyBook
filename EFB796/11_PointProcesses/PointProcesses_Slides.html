# Point Processes


**Spatial point processes** refers to locations in space that can be *marked* or *unmarked*.  


Typical questions: 

- What is their density? 
- Is their density uniform?  
- If not - what is it? (clustered or uniform)?  
- If not - why not? 
- How are their densities changing in time? 

]

# (homogeneous) Poisson Process

.pull-left-40[
(aka **Complete Spatial Randomness (CSR)**) has constant intensity `\(\lambda\)` across the study region.

**Intensity**: `\(\widehat{\lambda} = n/A\)`
  - `\(n\)` = number of points
  - `\(A\)` = area of study region

  - Equal probability anywhere in region
  - No interaction between points

Number of points in any region `\(\sim \text{Poisson}(\lambda \cdot \text{area})\)`

Distance to nearest neighbor `\(\sim \text{Exp}\)`
 Foundation for testing spatial patterns
]

# Point patterns 

![](PointProcesses_Slides_files/figure-html/unnamed-chunk-4-1.png)&lt;!-- --&gt;


- Typical question: do we have clustering or repulsion?
- Usually answered with Ripley's K function or pair correlation function
- CSR serves as null hypothesis for testing spatial

---
# Ripley's K Function


.pull-left[
`$$\widehat{K}(r) = \lambda^{-1} \sum_{i\ne j} \frac{I(d_{ij}&lt;r)} n$$`

- `\(d_{ij}\)` is distance between the *i*th and *j*th points
- `\(r\)` is radius, 
- `\(\lambda\)` is intensity

**In short:** count the number of points within distance *r*

]

.pull-right[
![](ripley.png)
]

* **Gray envelope:** 95% confidence band under Complete Spatial Randomness (CSR)
* **CSR:** K function stays within envelope
* **Clustered:** K function **above** envelope 
* **Regular:** K function **below** envelope
]

In `spatstat` package:


``` r
K_csr &lt;- envelope(csr_pattern, Kest, nsim = 99, verbose = FALSE)
K_clust &lt;- envelope(clustered_pattern, Kest, nsim = 99, verbose = FALSE)
K_reg &lt;- envelope(regular_pattern, Kest, nsim = 99, verbose = FALSE)
```

# Inhomogeneous point process

![](PointProcesses_Slides_files/figure-html/unnamed-chunk-6-1.png)&lt;!-- --&gt;

- `\(\lambda(X)\)` intensity is a function of covariate.  
- **Estimated with an RSF!**

.pull-left-60[
# IPP is the best way to think of RSF's

## Intensity Function
`$$\lambda(s) = \exp(\beta_0 + \beta_1 x_1(s) + ... + \beta_p x_p(s))$$`

where:
- `\(\lambda(s)\)` = expected use intensity at location `\(s\)`
- `\(x_i(s)\)` = environmental covariates
- `\(\beta_i\)` = selection coefficients


- **Used locations** = realized point pattern
- **Intensity surface** = relative probability of use

Equivalent to logistic regression with infinitely weighted background
]
