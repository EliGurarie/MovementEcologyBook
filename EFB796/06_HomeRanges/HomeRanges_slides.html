# Home Range Primer

**Home ranges** and **territories** represent different concepts:

- **Home range**: Area traversed by an individual
- **Territory**: Defended portion of home range
- **Core areas**: High-intensity use zones within home ranges
- **Zones of overlap**: Shared areas between individuals
]

.pull-right-60[
&lt;br&gt;
![](images/conceptual.png)
]

---

# What is a Home Range?

.pull-left-50.large[

The most commonly cited definition (Burt, 1943):

&gt; *"that area traversed by an individual in its normal activities of food gathering, mating and caring for young"*

**Key point:** 'Occasional sallies' should not be considered as part of the home range
]


.pull-right-50[
&lt;br&gt;&lt;br&gt;&lt;br&gt;
![](images/Burt1943.png)
]



---

# Issues with Burt's Definition

.pull-left.large[
**What qualifies as 'normal' activity?**

Space use patterns arise from various behaviors:
- Food gathering
- Mating 
- Caring for young
- Predator avoidance
- Refuge use

Does "what is normal" shift over time?
]

--

.pull-right.large[
**What qualifies as a 'sally'?**

Circular reasoning problem:
- Need defined home range to identify sallies
- Need to remove sallies to define home range
- Burt gives no guidance on this!
]

---

# More Issues with the Definition

.pull-left.large[
**Intensity of use variation**

Even at fine scales, movements reflect differential use:
- 8 hours in bedroom
- 30 minutes in bathroom

Burt's definition can't differentiate between these usage intensities.
]

--

.pull-right.large[
**How to delimit the region?**

This is one of the great challenges in movement ecology over the past few decades.

Various methods have been developed - we'll discuss several today.
]

---

# Why Do We Care About Home Ranges?

**Conservation and Management:** Difficult to conserve species without understanding space use. Will parks be successful? Will fences inhibit resource access?

--

**Disease Transmission:** Do individuals use same spaces at same/different times? Important for predicting pathogen spread.

--

**Human-Wildlife Conflict:** When and where do humans and wildlife come into contact? Are settlements within animal home ranges?

--

**Tourism, Hunting &amp; Recreation:** Many industries built on knowledge of animal movement patterns. Shifting expectations can create conflict.

--

**Any others you can think of?**

---

# Home Range Size Predictors

.pull-left.large[
According to recent meta-analysis of GPS data (Tucker et al. 2014):

- **Body size:** 53-85% of variance in home range size
- **Diet:** ~15% of variance  
- **Environment:** Only 1.7% of variance

Body mass is the strongest predictor!
]

.pull-right[
.center[
![](images/tucker.png)
]
]


---



.pull-left.large[
# Home Range Size Predictors II

According to recent meta-analysis of terrestrial mammals in Brazil:

- The patterns are strongly mediated by ***sex*** ... 

- *females* show *no relationship*


&lt;br&gt;&lt;br&gt;&lt;br&gt;

.footnote.red[Giroux et al. (*in press*) Ecology Letters]

]

.pull-right[
.center[
![](images/GirouxResults.png)
]
]

# Minimum Convex Polygon (MCP) Method

.pull-left-40.large[
**Most basic method:**
- Draw polygon around outermost points
- Everything within = home range

**Problems:**
- Includes vast unused areas
- Sensitive to outliers
- No intensity information
]

.pull-right-60[
![](images/mcp.png)

]

---

# Kernel Density Estimates (KDE) 

.pull-left[

## Strengths:
- utilization distribution (densities)

## Weaknesses:
- includes areas that are not likely or possible to
use
- does not recognize boundaries well
- selecting bandwidth is **arbitrary** and has big influence
- selecting kernel shape is similarly **arbitrary**.  

]

--

.pull-right[
![](images/kde.png)
]

---

## KDE's (aka **Utilization Distributions**) depend strongly on bandwidth

![](images/kde2.png)


---

# Autocorrelated Kernel Density Estimates
#### `ctmm` R package
.squeeze-60[
![](images/akde.png)
]



.pull-left[
#### Strengths
-  Accounts for autocorrelation by adjusting the
bandwidth
- Doesn’t over fit
- Agnostic about data sampling &amp; bandwidths
]

.pull-right[
#### Weaknesses
- Need to understand continuous time movement models
- Strong assumption
- Slow 
]

---

# Comparing Methods

.pull-left.large[
**MCP Method:**
- Simple boundary
- No usage intensity
- Good for broad-scale processes
- Example: Disease transmission via home range overlap

![Simple point cloud with polygon boundary]
]

.pull-right.large[
**UD/KDE Method:**  
- Probability surface
- Shows usage intensity
- Good for fine-scale details
- Example: Predicting where within home range animal occurs


]


---

---

# Method Selection Considerations

.large[
**Choose MCP when:**
- Simple presence/absence sufficient
- Broad-scale ecological processes
- Computational simplicity needed

**Choose UD/KDE when:**
- Usage intensity matters
- Fine-scale spatial predictions needed
- Understanding core vs. peripheral areas important

**Remember:** User-defined parameters (smoothing method, bandwidth) can affect results!
]

---

# Key Takeaways

.large[
1. **Home range definition** has conceptual challenges but remains useful

3. **Method choice matters** - MCP vs. KDE serve different purposes

4. **No perfect method** - each has strengths and limitations

5. **Context is critical** - territorial vs. migratory behavior patterns require different approaches
]

--

.center.red.large[
&lt;br&gt;&lt;br&gt;
**The key is matching your method to your research question!**
]
