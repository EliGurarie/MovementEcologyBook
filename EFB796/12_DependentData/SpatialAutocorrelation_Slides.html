# Recalling Generalized Least Squares

.pull-left[
Linear model with correlated residuals:

`$$Y_i = \beta X_{ij} + \epsilon_{ij}$$`

where `\(\epsilon \sim \mathcal{N}(0, \Sigma)\)`

For **AR(1)** temporal correlation:

`$$\text{Cor}(\epsilon_t, \epsilon_{t-h}) = \phi^h$$`
]

.pull-right[
The residual variance-covariance matrix:

`$$\Sigma = \sigma^2 \begin{bmatrix}
1 &amp; \phi &amp; \phi^2 &amp; \cdots \\
\phi &amp; 1 &amp; \phi &amp; \cdots \\
\phi^2 &amp; \phi &amp; 1 &amp; \cdots \\
\vdots &amp; \vdots &amp; \vdots &amp; \ddots
\end{bmatrix}$$`

Only **two parameters**: `\(\phi\)` and `\(\sigma^2\)`
]

---
# Spatial Autocorrelation

.pull-left[
The **Gaussian spatial correlation** structure:

`$$\text{Cor}(\epsilon_{i}, \epsilon_{j}) = \exp \left(- \left(\frac{r_{ij}}{\lambda}\right)^2\right)$$`

Where:
- `\(r_{ij}\)` = distance between points `\(i\)` and `\(j\)`
- `\(\lambda\)` = spatial correlation scale parameter
]

.pull-right[
**Key properties:**

| Distance | Correlation |
|----------|-------------|
| `\(r = 0\)` | 1 |
| `\(r = \lambda\)` | `\(1/e \approx 0.37\)` |
| `\(r \to \infty\)` | 0 |

`\(\lambda\)` is interpretable: points within distance `\(\lambda\)` affect each other importantly
]

---
# Why Does This Matter?

.center[
### The biggest risk of ignoring spatial correlations:

## **Spurious results**

### *p*-values will be artificially too low
]

--

- Spatial data often violates independence assumption
- Standard errors are underestimated
- You may "detect" patterns that don't exist

---

# Standard Linear Model

Does surface soil quality predict thickness?


``` r
soil.lm &lt;- lm(thick ~ soil, spdata)
```

```
##             Estimate Std. Error t value Pr(&gt;|t|)
## (Intercept)    0.471      0.065   7.278    0.000
## soil           0.036      0.014   2.578    0.011
```

--

**Looks significant!** But are the residuals independent?

---
# GLS: Same Result (So Far)

Using `gls()` from `nlme` package with default settings:


``` r
require(nlme)
soil.gls &lt;- gls(thick ~ soil, spdata)
```

```
## (Intercept)        soil 
##       0.471       0.036
```

Coefficients and p-values are identical to `lm()`

---
# Adding Spatial Correlation

.small[

``` r
soil.gls.spatial &lt;- gls(thick ~ soil, spdata, correlation = corGaus(1, ~ east + north))
summary(soil.gls.spatial)
```

```

##   Data: spdata

# Syntax Notes

**Correlation structure specification:**


``` r
corGaus(value, form = ~ east + north)
```

- `value`: initial estimate for range parameter
- `form`: formula specifying spatial coordinates

**Other correlation structures** (see `?corClasses`):
- `corExp()` - Exponential
- `corSpher()` - Spherical  
- `corLin()` - Linear
- `corRatio()` - Rational quadratic

---
# Using lme() Instead

Nearly identical syntax, but requires a random effect:


``` r
require(plyr)
soil.lme &lt;- lme(fixed = thick ~ soil, 
                data = mutate(spdata, dummy = 1), 
                correlation = corGaus(1, ~ east + north),
                random = ~ 1 | dummy, 
                method = "ML")
```

- More general/powerful but slower
- Requires dummy random effect for purely spatial models
- Same conclusions

---
# Challenges &amp; Limitations

.pull-left[
**Practical issues:**

- Best defined for **Gaussian** models
- For GLMs: harder to separate model from residual
- Large matrices = slow fitting
- Combining temporal + spatial correlation is difficult
]

.pull-right[
**Advanced solutions:**

- **Bayesian MCMC**: Can fit anything, but slow
- **INLA** (Integrated Nested Laplace Approximations): 
  - http://www.r-inla.org/
  - Most powerful tool for complex spatial models
]


---
# Key Takeaways

.pull-left[
### Spatial correlation matters

- Ignoring it inflates significance
- Standard errors are too small
- Risk of false positives
]

.pull-right[
### Tools available

- `gls()` and `lme()` in `nlme`
- Multiple correlation structures
- Interpretable range parameter `\(\lambda\)`
]

.center[
### Always check for spatial autocorrelation in spatial data!
]

# Exercise: Ozone Data

---
# Ozone Data Structure

.pull-left[


``` r
require(plyr); require(maps); require(fields)
O3 &lt;- plyr::ozone
lat &lt;- as.numeric(row.names(O3[,,1]))
long &lt;- as.numeric(colnames(O3[,,1]))
```

24 × 24 × 72 array: monthly ozone averages, Jan 1995 - Dec 2000

]

.pull-right[
![](SpatialAutocorrelation_Slides_files/figure-html/unnamed-chunk-13-1.png)&lt;!-- --&gt;

]

---
# Reshaping the Data



``` r
require(reshape2)
O3.df &lt;- melt(O3)
head(O3.df, 4)
```

```
##     lat   long time value
## 1 -21.2 -113.8    1   260
## 2 -18.7 -113.8    1   258
## 3 -16.2 -113.8    1   258
## 4 -13.7 -113.8    1   254
```


``` r
O3.df &lt;- mutate(O3.df, 
                year = 1995 + floor((time-1)/12), 
                month = time - (floor((time-1)/12) * 12))
```

---
# Projecting Coordinates

Convert lat/long to consistent units (km):


``` r
require(sf)
O3.sf &lt;- st_as_sf(O3.df, coords = c("long", "lat")) |&gt;
  st_set_crs(4326) |&gt;
  st_transform(5367)  # Appropriate projection for Central America
xy &lt;- st_coordinates(O3.sf)
O3.df &lt;- data.frame(O3.df, xy)
```

---
# Exercise Tasks

For a chosen month/year combination:

1. **Map** the ozone concentration

2. **Fit linear regression** of ozone vs. East and North coordinates
   - Is there a spatial trend?

3. **Estimate spatial correlation scale** using `gls()` with `corGaus()`

4. **Compare conclusions** with and without spatial correlation

5. **Bonus**: Write a function to analyze all months
   - Are there annual patterns in correlation scale?
   - Are there annual patterns in spatial trends?
