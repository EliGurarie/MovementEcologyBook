# One Slide Summary of Linear Modeling

.pull-left[
**Simple:**
`$$Y_i = \mathbf{X} \beta + \epsilon_i, \quad \epsilon_i \sim \mathcal{N}(0, \sigma^2)$$`

**Generalized:**
`$$Y_i \sim \text{Distribution}(\mu), \quad g(\mu) = \mathbf{X} \beta$$`

**Generalized Additive:**
`$$g(\mu_i) = \mathbf{X}_i \beta + \sum_j f_j(x_{ji})$$`
]

.pull-right[
### Critical assumption:

In all cases, `\(i\)` is **unordered**!

`\(Y_1, Y_2, Y_3 ... Y_n\)` can be reshuffled with no impact

All residuals are **independent**:
`$$\text{cov}(\epsilon_i, \epsilon_j) = 0$$`
]

---
# Basic Definitions

**Stochastic process:** Any process structured by an index
`$$X_{t_n} = f(X_{t_1}, X_{t_2}, ... X_{t_{n-1}})$$`

**Time-series:** A stochastic process indexed by *time*

**Discrete-time:** Data at regular intervals (Annual, Monthly, Daily...)
- `\(t\)` denoted `\(1, 2, 3, ... n\)`

**Continuous-time:** Data at arbitrary intervals
- `\(t_i \in \{T_{min}, T_{max}\}\)`

# Autocorrelation Functions

**Autocovariance function:**
`$$\gamma(h) = \text{cov}[X_t, X_{t-h}]$$`

**Autocorrelation function (ACF):**
`$$\rho(h) = \text{cor}[X_t, X_{t+h}]$$`

--

### Sample estimates:

`$$\widehat{\gamma}(h) = \frac{1}{n} \sum_{t=1}^{n-|h|} (X_{t+|h|} - \bar{X})(X_t - \bar{X})$$`

`$$\widehat{\rho}(h) = \frac{\widehat{\gamma}(h)}{\widehat{\gamma}(0)}$$`

---

# The Autoregressive Model: AR(1)

**First order autoregressive model:**

`$$X_t = \phi_1 X_{t-1} + Z_t$$`

where `\(Z_t \sim \mathcal{N}(0, \sigma^2)\)` is **White Noise**

--

With non-zero mean:
`$$X_t = \phi_1 (X_{t-1} - \mu) + Z_t + \mu$$`

--

### Key properties:
- `\(\text{E}[X] = \mu\)`
- `\(\text{Var}[X] = \sigma^2 / (1 - \phi_1^2)\)`
- `\(\rho(h) = \phi_1^h\)` (exponential decay!)

---
# AR(1): Theoretical ACF

`$$\rho(h) = \phi_1^h$$`

&lt;img src="TimeSeries_slides_files/figure-html/unnamed-chunk-6-1.png" style="display: block; margin: auto;" /&gt;

.center[If ACF looks exponential → probably AR(1)]

# But What About the Trend?

**Decomposition:**
`$$\Large Y_t = m_t + X_t$$`

- `\(m_t\)` = slowly varying **trend**

- `\(X_t\)` = random component (can have autocorrelation)

- `\(\text{E}[X_t] = 0\)`

- `\(X_t\)` must be **stationary**

--

### Definition: Stationary

A process `\(X_t\)` is **stationary** if `\(\text{E}[X_t]\)` is independent of `\(t\)`

---
# Lake Huron: Trend + AR(1)

`$$Y_T = \beta_0 + \beta_1 T + X_T$$`
`$$X_T = \phi_1 X_{T-1} + Z_T$$`

![](TimeSeries_slides_files/figure-html/unnamed-chunk-10-1.png)&lt;!-- --&gt;

---
# Two-Step Approach

.pull-left-60[

**Step 1:** Fit trend

``` r
LH.trend &lt;- lm(LakeHuron ~ time(LakeHuron))
summary(LH.trend)$coef |&gt; round(3)
```

```
##                 Estimate Std. Error t value Pr(&gt;|t|)
## (Intercept)      625.555      7.764  80.568        0
## time(LakeHuron)   -0.024      0.004  -5.996        0
```

**Highly significant!** p &lt; 0.001



**Step 2:** Fit AR(1) to residuals

``` r
X &lt;- residuals(LH.trend)
X.lm &lt;- lm(X[-1] ~ X[-length(X)])
coef(X.lm)[2]  # phi_1
```

```
## X[-length(X)] 
##      0.791118
```

]

.pull-right-40[

**Good estimate of residual autocorrelation**

But the 2-step approach ideal is not ideal, in part because we *STILL DON'T KNOW if the trend is significant!

]

---
# One-Step: Generalized Least Squares


``` r
require(nlme)
LH.gls &lt;- gls(LakeHuron ~ time(LakeHuron), 
              correlation = corAR1(form = ~1))
summary(LH.gls)$tTable |&gt; round(3)
```

```
##                   Value Std.Error t-value p-value
## (Intercept)     616.489    24.363  25.305   0.000
## time(LakeHuron)  -0.019     0.013  -1.535   0.128
```

--

.center[
### Wait... TIME is no longer significant!?
### p = 0.13 vs p &lt; 0.001
]

---
# What Happened?

.pull-left[
### Standard Linear Model

- Assumes independent errors
- Underestimates standard errors
- **Artificially low p-values**
- False positives!
]

.pull-right[
### Generalized Least Squares

- Models correlated errors
- Correct standard errors
- **Honest p-values**
- Avoids false inference
]

--
&lt;br&gt;&lt;br&gt;
.center[
### The trend may not be as significant as we thought!
]

---
# Generalized Least Squares: Theory

**OLS:** Assumes `\(\epsilon \sim \mathcal{N}(0, \sigma^2 \mathbf{I}_n)\)`

`$$\hat{\beta} = (\mathbf{X}'\mathbf{X})^{-1}\mathbf{X}'y$$`

--

**GLS:** Assumes `\(\epsilon \sim \mathcal{N}(0, \Sigma)\)` with correlated errors

`$$\hat{\beta}_{gls} = (\mathbf{X}'\Sigma^{-1}\mathbf{X})^{-1}\mathbf{X}'\Sigma^{-1}y$$`

--

**The challenge:** `\(\Sigma\)` has `\(n(n+1)/2\)` elements!

**Solution:** Assume a tractable structure (e.g., AR(1))

---
# Variance-Covariance Matrix for AR(1)
.pull-left[


`$$\Sigma = \sigma^2 \begin{bmatrix}
1 &amp; \phi &amp; \phi^2 &amp; \phi^3 &amp; \cdots \\
\phi &amp; 1 &amp; \phi &amp; \phi^2 &amp; \cdots \\
\phi^2 &amp; \phi &amp; 1 &amp; \phi &amp; \cdots \\
\phi^3 &amp; \phi^2 &amp; \phi &amp; 1 &amp; \cdots \\
\vdots &amp; \vdots &amp; \vdots &amp; \vdots &amp; \ddots
\end{bmatrix}$$`

Only **2 parameters**: `\(\phi\)` and `\(\sigma^2\)`
]

.pull-right[

&lt;img src="TimeSeries_slides_files/figure-html/unnamed-chunk-14-1.png" style="display: block; margin: auto;" /&gt;

]

---
# Comparing Models with AIC


``` r
LH.gls0 &lt;- gls(LakeHuron ~ 1, 
               correlation = corAR1(form = ~1), method = "ML")
LH.gls1 &lt;- gls(LakeHuron ~ time(LakeHuron), 
               correlation = corAR1(form = ~1), method = "ML")
anova(LH.gls0, LH.gls1)
```

```
##         Model df      AIC      BIC    logLik   Test  L.Ratio p-value
## LH.gls0     1  3 219.1960 226.9509 -106.5980                        
## LH.gls1     2  4 218.4502 228.7900 -105.2251 1 vs 2 2.745803  0.0975
```

Model with time has slightly lower AIC, but difference is small

---
# Key Takeaways

.pull-left[
### The danger of ignoring autocorrelation

- Standard errors too small

- p-values artificially low

- **False positives**

- Spurious "significant" results
]

.pull-right[
### The solution

- Use `gls()` with correlation structure

- `corAR1()` for first-order autocorrelation

- Always check ACF of residuals

- Compare models with AIC/BIC
]

---
# Practical Workflow

.large[
1. **Visualize** your time series
2. **Fit** a standard linear model
3. **Check** ACF of residuals
4. If autocorrelated → **fit GLS** with appropriate correlation structure
5. **Compare** conclusions with and without correlation
6. **Validate** with diagnostic plots
]

--

&gt; .center[
### Even (especially?) for simple questions about linear trends...

### it's easy to make false inference without accounting for autocorrelation!
]
